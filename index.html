<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コパの競馬予想 Ver1.1</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

.header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.add-btn{
    background:#1976d2;
    color:white;
}

.save-btn{
    background:#ff9800;
    color:white;
}

.load-btn{
    background:#4CAF50;
    color:white;
}

.edit-btn{
    width:auto;
    background:#4CAF50;
    color:white;
}

.delete-btn{
    width:auto;
    background:#f44336;
    color:white;
}

.horse{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

.rank{
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}

.value{
    color:#1565c0;
    font-weight:bold;
}

.memo{
・・・
}

select{

width:100%;
padding:10px;
margin-bottom:10px;
box-sizing:border-box;

}

</style>
</head>

<body>

<div class="header">
🐴 コパの競馬予想 Ver1.1
</div>

<div class="container">

<div class="card">

<h2>レース情報</h2>

<input
id="raceName"
placeholder="例：札幌11R">
<label>馬場状態</label>

<select id="trackCondition">

<option value="良">良</option>

<option value="稍重">稍重</option>

<option value="重">重</option>

<option value="不良">不良</option>

</select>

<label>馬場傾向</label>

<select id="trackBias">

<option value="フラット">フラット</option>

<option value="内有利">内有利</option>

<option value="外有利">外有利</option>

<option value="前有利">前有利</option>

<option value="差し有利">差し有利</option>

</select>

</div>

<div class="card">

<h2>🏆 今日の本命馬</h2>

<div id="mainHorse">
まだ登録されていません
</div>

</div>

<div class="card">

<h2>📋 今日の印一覧</h2>

<div id="markList">
まだ登録されていません
</div>

</div>

<div class="card">

<h2>🥇 総合点ランキング</h2>

<div id="rankingList">
まだ登録されていません
</div>

</div>    

<div class="card">

<h3>📥 出走表一括取込</h3>

<textarea
id="bulkInput"
placeholder="1,1,サヴマ,横山武史,57"></textarea>

<button
class="add-btn"
onclick="importBulk()">
📥 一括取込
</button>

</div>

<div class="card">

<h2>出馬表入力</h2>

<input id="horseFrame" placeholder="枠番">

<input id="horseNo" placeholder="馬番">

<input id="horseName" placeholder="馬名">

<input id="horseJockey" placeholder="騎手">

<input id="horseWeight" placeholder="斤量">

<input id="horseRank"
placeholder="評価（◎ ○ ▲ △ ×）">

<input id="horseValue"
placeholder="期待値ランク（S A B C D）">

<input
id="horseTrack"
placeholder="馬場適性（◎ ○ △ ×）">

<input id="horseOdds"
placeholder="単勝オッズ">

<textarea
id="horseMemo"
placeholder="メモ"></textarea>

<button
class="add-btn"
onclick="addHorse()">
馬を追加
</button>

<button
class="save-btn"
onclick="exportJSON()">
💾 JSON保存
</button>

<input
type="file"
id="jsonFile"
accept=".json">

<button
class="load-btn"
onclick="importJSON()">
📂 JSON読込
</button>

</div>

<div class="card">

<h2>登録済み出走馬</h2>

<div id="horseList"></div>

</div>

</div>

<script>
let horses =
JSON.parse(
localStorage.getItem("horses")
) || [];

renderList();

function saveData(){

localStorage.setItem(
"horses",
JSON.stringify(horses)
);

}

function importBulk(){

const text =
document.getElementById(
"bulkInput"
).value.trim();

if(!text){

alert("データを入力してください");
return;

}

const lines =
text.split("\n");

lines.forEach(line=>{

const cols =
line.split(",");

if(cols.length < 6) return;

const odds =
cols[5].trim();

horses.push({

frame: cols[0].trim(),
no: cols[1].trim(),
name: cols[2].trim(),
jockey: cols[3].trim(),
weight: cols[4].trim(),

rank:
getRankFromOdds(odds),

value:
getValueFromOdds(odds),

track:"△",

odds:odds,

memo:""

});

});

saveData();
renderList();

document.getElementById(
"bulkInput"
).value="";

alert("一括取込完了");

}

function addHorse(){

const frame =
document.getElementById(
"horseFrame"
).value;

const no =
document.getElementById(
"horseNo"
).value;

const name =
document.getElementById(
"horseName"
).value;

const jockey =
document.getElementById(
"horseJockey"
).value;

const weight =
document.getElementById(
"horseWeight"
).value;

const rank =
document.getElementById(
"horseRank"
).value;

const value =
document.getElementById(
"horseValue"
).value;

const track =
document.getElementById(
"horseTrack"
).value;
    
const odds =
document.getElementById(
"horseOdds"
).value;

const memo =
document.getElementById(
"horseMemo"
).value;

if(
!frame ||
!no ||
!name ||
!jockey ||
!weight ||
!rank ||
!value ||
!track ||
!odds
){

alert("必須項目を入力してください");
return;

}

horses.push({

frame,
no,
name,
jockey,
weight,
rank,
value,
track,
odds,
memo

});

saveData();
renderList();

document.getElementById("horseFrame").value="";
document.getElementById("horseNo").value="";
document.getElementById("horseName").value="";
document.getElementById("horseJockey").value="";
document.getElementById("horseWeight").value="";
document.getElementById("horseRank").value="";
document.getElementById("horseValue").value="";
document.getElementById("horseTrack").value="";
document.getElementById("horseOdds").value="";
document.getElementById("horseMemo").value="";


}

function editHorse(index){

const horse =
horses[index];

const frame =
prompt("枠番",horse.frame);
if(frame===null) return;

const no =
prompt("馬番",horse.no);
if(no===null) return;

const name =
prompt("馬名",horse.name);
if(name===null) return;

const jockey =
prompt("騎手",horse.jockey);
if(jockey===null) return;

const weight =
prompt("斤量",horse.weight);
if(weight===null) return;

const rank =
prompt("評価",horse.rank);
if(rank===null) return;

const value =
prompt(
"期待値ランク",
horse.value
);
if(value===null) return;

const odds =
prompt(
"単勝オッズ",
horse.odds
);
if(odds===null) return;

const memo =
prompt(
"メモ",
horse.memo || ""
);
if(memo===null) return;

const track =
prompt(
"馬場適性",
horse.track || "△"
);

if(track===null) return;    

horses[index] = {

frame,
no,
name,
jockey,
weight,
rank,
value,
track,
odds,
memo

};

saveData();
renderList();

}

function deleteHorse(index){

if(confirm("削除しますか？")){

horses.splice(
index,
1
);

saveData();
renderList();

}

}

function exportJSON(){

const raceName =
document.getElementById(
"raceName"
).value;

const data = {

raceName,
horses

};

const blob =
new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(
blob
);

const a =
document.createElement(
"a"
);

a.href = url;

a.download =
(raceName || "race")
+ ".json";

a.click();

URL.revokeObjectURL(
url
);

}

function importJSON(){

const file =
document.getElementById(
"jsonFile"
).files[0];

if(!file){

alert(
"JSONファイルを選択してください"
);

return;

}

const reader =
new FileReader();

reader.onload =
function(event){

const data =
JSON.parse(
event.target.result
);

document.getElementById(
"raceName"
).value =
data.raceName || "";

horses =
data.horses || [];

saveData();
renderList();

alert(
"読込完了"
);

};

reader.readAsText(file);

}
function getRankPoint(rank){

switch(rank){

case "◎":
return 5;

case "○":
return 4;

case "▲":
return 3;

case "△":
return 2;

default:
return 1;

}

}

function getValuePoint(value){

switch(value){

case "S":
return 5;

case "A":
return 4;

case "B":
return 3;

case "C":
return 2;

default:
return 1;

}

}

function getTrackPoint(track){

switch(track){

case "◎":
return 2;

case "○":
return 1;

case "△":
return 0;

default:
return -1;

}

}

function getRankFromOdds(odds){

odds = Number(odds);

if(odds <= 3) return "◎";

if(odds <= 7) return "○";

if(odds <= 15) return "▲";

if(odds <= 30) return "△";

return "×";

}    

function getValueFromOdds(odds){

odds = Number(odds);

if(odds <= 5) return "D";

if(odds <= 10) return "C";

if(odds <= 20) return "B";

if(odds <= 40) return "A";

return "S";

}
``    

function renderList(){

let html = "";

horses.forEach((horse,index)=>{

const totalPoint =
getRankPoint(horse.rank)
+
getValuePoint(horse.value || "D")
+
getTrackPoint(horse.track || "△");

html += `

<div class="horse">

<b>
${horse.frame}枠
${horse.no}番
${horse.name}
</b>

<br><br>

<div class="rank">
評価：${horse.rank}
</div>

<div class="value">
期待値：${horse.value}
<br>

馬場適性：${horse.track || "△"}

<br>

総合点：${totalPoint}
</div>

<br>

騎手：${horse.jockey}

<br>

斤量：${horse.weight}kg

<br><br>

単勝オッズ：${horse.odds || "-"}

<div class="memo">

<b>メモ</b>

<br>

${horse.memo || "なし"}

</div>

<br>

<button
class="edit-btn"
onclick="editHorse(${index})">
✏️編集
</button>

<button
class="delete-btn"
onclick="deleteHorse(${index})">
🗑削除
</button>

</div>

`;

});

document.getElementById(
"horseList"
).innerHTML = html;

updateSummary();

}

function updateSummary(){

let bestPoint = -1;

let mainHorse =
"まだ登録されていません";

const marks = [];

const ranking = [];

horses.forEach(horse=>{

const totalPoint =
getRankPoint(horse.rank)
+
getValuePoint(horse.value || "D")
+
getTrackPoint(horse.track || "△");

ranking.push({

name: horse.name,

point: totalPoint,

odds: Number(
horse.odds || 999
)

});

if(totalPoint > bestPoint){

bestPoint =
totalPoint;

mainHorse =
`${horse.name}
（総合点:${totalPoint}）`;

}

});

ranking.sort((a,b)=>{

if(b.point !== a.point){

return b.point - a.point;

}

return a.odds - b.odds;

});

const markSymbol =

["◎","○","▲","△"];

marks.length = 0;

ranking.forEach((horse,index)=>{

if(index < 4){

marks.push(

`${markSymbol[index]}
${horse.name}`

);

}

});    
let rankingHtml = "";

ranking.forEach((horse,index)=>{

rankingHtml +=

`${index + 1}位
${horse.name}
（${horse.point}点）

<br>`;

});
    
document.getElementById(
"mainHorse"
).innerHTML =
mainHorse;

document.getElementById(
"markList"
).innerHTML =
marks.length
? marks.join("<br>")
: "まだ登録されていません";

document.getElementById(
"rankingList"
).innerHTML =
ranking.length
? rankingHtml
: "まだ登録されていません";    

}

</script>

</body>
</html>
