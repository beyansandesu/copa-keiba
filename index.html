<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コパ競馬予想</title>

<style>
body{
    font-family:sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 12px;
    margin:3px;
    cursor:pointer;
}

.horse{
    border:1px solid #ddd;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🐴 コパ競馬予想</h1>

<h3>出走馬登録</h3>

<input id="horseName" placeholder="馬名">

<input id="horseOdds"
       type="number"
       step="0.1"
       placeholder="オッズ">

<button onclick="addHorse()">
追加
</button>

<hr>

<div id="horseList"></div>

<script>

let horses =
JSON.parse(
localStorage.getItem("horses")
) || [];

function saveData(){
    localStorage.setItem(
        "horses",
        JSON.stringify(horses)
    );
}

function render(){

    let html="";

    horses.forEach((horse,index)=>{

        html += `
        <div class="horse">

            <strong>${horse.name}</strong>
            <br>
            オッズ：${horse.odds}倍
            <br><br>

            <button onclick="editHorse(${index})">
            編集
            </button>

            <button onclick="deleteHorse(${index})">
            削除
            </button>

        </div>
        `;
    });

    document.getElementById(
        "horseList"
    ).innerHTML = html;
}

function addHorse(){

    const name =
    document.getElementById(
        "horseName"
    ).value;

    const odds =
    document.getElementById(
        "horseOdds"
    ).value;

    if(!name || !odds){
        alert("入力してください");
        return;
    }

    horses.push({
        name:name,
        odds:odds
    });

    saveData();
    render();

    document.getElementById(
        "horseName"
    ).value="";

    document.getElementById(
        "horseOdds"
    ).value="";
}

function editHorse(index){

    const horse = horses[index];

    const newName =
    prompt(
        "馬名",
        horse.name
    );

    if(newName===null) return;

    const newOdds =
    prompt(
        "オッズ",
        horse.odds
    );

    if(newOdds===null) return;

    horses[index]={
        name:newName,
        odds:newOdds
    };

    saveData();
    render();
}

function deleteHorse(index){

    if(confirm("削除しますか？")){

        horses.splice(index,1);

        saveData();
        render();
    }
}

render();

</script>

</body>
</html>
