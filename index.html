<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コパの競馬予想 Ver1.1</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

.header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.add-btn{
    background:#1976d2;
    color:white;
}

.save-btn{
    background:#ff9800;
    color:white;
}

.load-btn{
    background:#4CAF50;
    color:white;
}

.edit-btn{
    width:auto;
    background:#4CAF50;
    color:white;
}

.delete-btn{
    width:auto;
    background:#f44336;
    color:white;
}

.horse{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

.rank{
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}

.value{
    color:#1565c0;
    font-weight:bold;
}

.memo{
    background:#fffde7;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
🐴 コパの競馬予想 Ver1.1
</div>

<div class="container">

<div class="card">

<h2>レース情報</h2>

<input
id="raceName"
placeholder="例：札幌11R">

</div>

<div class="card">

<h2>🏆 今日の本命馬</h2>

<div id="mainHorse">
まだ登録されていません
</div>

</div>

<div class="card">

<h2>📋 今日の印一覧</h2>

<div id="markList">
まだ登録されていません
</div>

</div>

<div class="card">

<h3>📥 出走表一括取込</h3>

<textarea
id="bulkInput"
placeholder="1,1,サヴマ,横山武史,57"></textarea>

<button
class="add-btn"
onclick="importBulk()">
📥 一括取込
</button>

</div>

<div class="card">

<h2>出馬表入力</h2>

<input id="horseFrame" placeholder="枠番">

<input id="horseNo" placeholder="馬番">

<input id="horseName" placeholder="馬名">

<input id="horseJockey" placeholder="騎手">

<input id="horseWeight" placeholder="斤量">

<input id="horseRank" placeholder="評価（◎ ○ ▲ △ ×）">

<input id="horseValue" placeholder="期待値ランク（S A B C D）">

<input id="horseOdds" placeholder="単勝オッズ">

<textarea
id="horseMemo"
placeholder="メモ"></textarea>

<button
class="add-btn"
onclick="addHorse()">
馬を追加
</button>

<button
class="save-btn"
onclick="exportJSON()">
💾 JSON保存
</button>

<input
type="file"
id="jsonFile"
accept=".json">

<button
class="load-btn"
onclick="importJSON()">
📂 JSON読込
</button>

</div>

<div class="card">

<h2>登録済み出走馬</h2>

<div id="horseList"></div>

</div>

</div>

<script>
