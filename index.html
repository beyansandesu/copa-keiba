<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コパ競馬予想</title>

<style>
body{
    font-family:sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

.horse{
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
}
</style>

</head>
<body>

<h1>🐴コパ競馬予想</h1>

<input id="no" placeholder="馬番">
<input id="name" placeholder="馬名">
<input id="odds" placeholder="オッズ">

<button onclick="addHorse()">馬を追加</button>

<div id="horseList"></div>

<script>

let horses =
JSON.parse(
localStorage.getItem("horses")
) || [];

render();

function addHorse(){

    horses.push({
        no: document.getElementById("no").value,
        name: document.getElementById("name").value,
        odds: document.getElementById("odds").value
    });

    save();
    render();
}

function save(){

    localStorage.setItem(
        "horses",
        JSON.stringify(horses)
    );
}

function render(){

    let html="";

    horses.forEach((h,i)=>{

        html += `
        <div class="horse">
            ${h.no}番
            ${h.name}
            ${h.odds}倍

            <button onclick="deleteHorse(${i})">
                削除
            </button>
        </div>
        `;
    });

    document.getElementById(
        "horseList"
    ).innerHTML=html;
}

function deleteHorse(i){

    horses.splice(i,1);

    save();
    render();
}
</script>

</body>
</html>
