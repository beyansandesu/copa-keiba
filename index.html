<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コパの競馬予想</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    padding:10px;
    margin-right:5px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#1976d2;
    color:white;
    border:none;
}

.edit-btn{
    background:#4CAF50;
    color:white;
    border:none;
}

.delete-btn{
    background:#f44336;
    color:white;
    border:none;
}

.horse{
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
🐴 コパの競馬予想
</div>

<div class="container">

<div class="card">

<h3>レース情報</h3>

<input
id="raceName"
placeholder="例：札幌11R">

</div>

<div class="card">

<h3>出馬表入力</h3>

<input
id="horseNo"
placeholder="馬番">

<input
id="horseName"
placeholder="馬名">

<input
id="horseOdds"
placeholder="単勝オッズ">

<button
class="add-btn"
onclick="addHorse()">
馬を追加
</button>

</div
