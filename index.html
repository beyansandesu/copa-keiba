<div class="card">

<h3>登録済み出走馬</h3>

<div id="horseList"></div>

</div>

</div>

<script>

let horses =
JSON.parse(
localStorage.getItem("horses")
) || [];

renderList();

function saveData(){

localStorage.setItem(
"horses",
JSON.stringify(horses)
);

}

function addHorse(){

const no =
document.getElementById("horseNo").value;

const name =
document.getElementById("horseName").value;

const odds =
document.getElementById("horseOdds").value;

if(!no || !name || !odds){

alert("入力してください");
return;

}

horses.push({
no,
name,
odds
});

saveData();
renderList();

}

function editHorse(index){

const horse = horses[index];

const no =
prompt("馬番", horse.no);

const name =
prompt("馬名", horse.name);

const odds =
prompt("オッズ", horse.odds);

horses[index]={
no,
name,
odds
};

saveData();
renderList();

}

function deleteHorse(index){

if(confirm("削除しますか？")){

horses.splice(index,1);

saveData();
renderList();

}

}

function renderList(){

let html="";

horses.forEach((horse,index)=>{

html += `
<div class="horse">

<b>${horse.no}番
${horse.name}</b>

<br>

オッズ ${horse.odds}倍

<br><br>

<button
class="edit-btn"
onclick="editHorse(${index})">

✏️編集

</button>

<button
class="delete-btn"
onclick="deleteHorse(${index})">

🗑削除

</button>

</div>
`;

});

document.getElementById(
"horseList"
).innerHTML = html;

}

</script>

</body>
</html>
