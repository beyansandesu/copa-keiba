<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コパの競馬予想 Ver1.2</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

.header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.add-btn{
    background:#1976d2;
    color:white;
}

.save-btn{
    background:#ff9800;
    color:white;
}

.load-btn{
    background:#4CAF50;
    color:white;
}

.toggle-btn{
    background:#607d8b;
    color:white;
}

.edit-btn{
    width:auto;
    background:#4CAF50;
    color:white;
}

.delete-btn{
    width:auto;
    background:#f44336;
    color:white;
}

.horse{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

.history-item{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
    background:#fafafa;
}

.rank{
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}

.value{
    color:#1565c0;
    font-weight:bold;
}

.memo{
    margin-top: 10px;
    background: #fafafa;
    padding: 8px;
    border-radius: 4px;
}

select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}
</style>
</head>

<body>

<div class="header">
🐴 コパの競馬予想 Ver1.2
</div>

<div class="container">

<div class="card">
<h2>レース情報</h2>
<input id="raceName" placeholder="例：札幌11R" oninput="saveRaceInfo()">
<label>馬場状態</label>
<select id="trackCondition" onchange="saveRaceInfo()">
<option value="良">良</option>
<option value="稍重">稍重</option>
<option value="重">重</option>
<option value="不良">不良</option>
</select>

<label>馬場傾向</label>
<select id="trackBias" onchange="saveRaceInfo()">
<option value="フラット">フラット</option>
<option value="内前有利">内前有利</option>
<option value="外前有利">外前有利</option>
<option value="内差有利">内差有利</option>
<option value="外差有利">外差有利</option>
</select>
</div>

<div class="card">
<h2>🏆 今日の本命馬</h2>
<div id="mainHorse">まだ登録されていません</div>
</div>

<div class="card">
<h2>📋 今日の印一覧</h2>
<div id="markList">まだ登録されていません</div>
</div>

<div class="card">
<h2>🥇 総合点ランキング</h2>
<div id="rankingList">まだ登録されていません</div>
</div>    

<div class="card">
<h2>🏁 保存済みレース</h2>
<button class="toggle-btn" onclick="toggleHistory()">📂 保存済みレースを表示/非表示</button>
<div id="historyContainer" style="display:none; margin-top:10px;">
    <div id="historyList">まだ保存されていません</div>
</div>
</div> 
<div class="card">

<h2>📊 成績ダッシュボード</h2>

<div id="dashboard">

まだデータがありません

</div>

</div>
    
<div class="card">
<h3>📥 出走表一括取込</h3>
<textarea id="bulkInput" placeholder="枠番,馬番,馬名,騎手,斤量,オッズ,馬場適性(任意)
例：1,1,サヴマ,横山武史,57,3.5,◎"></textarea>
<button class="add-btn" onclick="importBulk()">📥 一括取込</button>
</div>

<div class="card">
<h2>出馬表入力</h2>
<input id="horseFrame" placeholder="枠番">
<input id="horseNo" placeholder="馬番">
<input id="horseName" placeholder="馬名">
<input id="horseJockey" placeholder="騎手">
<input id="horseWeight" placeholder="斤量">
<input id="horseRank" placeholder="評価（◎ ○ ▲ △ ×）">
<input id="horseValue" placeholder="期待値ランク（S A B C D）">
<input id="horseTrack" placeholder="馬場適性（◎ ○ △ ×）">
<input id="horseOdds" placeholder="単勝オッズ">
<input id="horseFinish" placeholder="着順（1～18）">
<textarea id="horseMemo" placeholder="メモ"></textarea>
<button class="add-btn" onclick="addHorse()">馬を追加</button>
<button class="save-btn" onclick="exportJSON()">💾 JSON保存</button>
<button class="save-btn" onclick="saveRaceResult()">🏁 レース結果保存</button>
<input type="file" id="jsonFile" accept=".json">
<button class="load-btn" onclick="importJSON()">📂 JSON読込</button>
</div>

<div class="card">
<h2>登録済み出走馬</h2>
<div id="horseList"></div>
</div>

</div>

<script>
let horses = JSON.parse(localStorage.getItem("horses")) || [];
let raceHistory = JSON.parse(localStorage.getItem("raceHistory")) || [];

// レース情報の復元
document.getElementById("raceName").value = localStorage.getItem("raceName") || "";
document.getElementById("trackCondition").value = localStorage.getItem("trackCondition") || "良";
document.getElementById("trackBias").value = localStorage.getItem("trackBias") || "フラット";

renderList();
renderHistory();
renderDashboard();

function saveData(){
    localStorage.setItem("horses", JSON.stringify(horses));
}

function saveRaceHistory(){
    localStorage.setItem("raceHistory", JSON.stringify(raceHistory));
}

// レース情報（レース名・馬場状態・馬場傾向）が変更されたときの自動保存＆再描画
function saveRaceInfo(){
    localStorage.setItem("raceName", document.getElementById("raceName").value);
    localStorage.setItem("trackCondition", document.getElementById("trackCondition").value);
    localStorage.setItem("trackBias", document.getElementById("trackBias").value);
    renderList();
}

function toggleHistory(){
    const container = document.getElementById("historyContainer");
    if(container.style.display === "none"){
        container.style.display = "block";
    } else {
        container.style.display = "none";
    }
}
    
function importBulk(){
    const text = document.getElementById("bulkInput").value.trim();
    if(!text){
        alert("データを入力してください");
        return;
    }

    const lines = text.split("\n");
    let count = 0;

    lines.forEach(line=>{
        const cols = line.split(",");
        if(cols.length < 6) return;

        const frame = cols[0].trim();
        const no = cols[1].trim();
        const name = cols[2].trim();
        const jockey = cols[3].trim();
        const weight = cols[4].trim();
        const odds = cols[5].trim();
        const track = (cols.length >= 7 && cols[6].trim()) ? cols[6].trim() : "△";

        horses.push({
            frame: frame,
            no: no,
            name: name,
            jockey: jockey,
            weight: weight,
            rank: getRankFromOdds(odds),
            value: getValueFromOdds(odds),
            track: track,
            odds: odds,
            finish: "",
            memo: ""
        });
        count++;
    });   

    saveData();
    renderList();

    document.getElementById("bulkInput").value="";
    alert(count + "頭の一括取込完了");
}

function addHorse(){
    const frame = document.getElementById("horseFrame").value;
    const no = document.getElementById("horseNo").value;
    const name = document.getElementById("horseName").value;
    const jockey = document.getElementById("horseJockey").value;
    const weight = document.getElementById("horseWeight").value;
    const rank = document.getElementById("horseRank").value;
    const value = document.getElementById("horseValue").value;
    const track = document.getElementById("horseTrack").value;
    const odds = document.getElementById("horseOdds").value;
    const finish = document.getElementById("horseFinish").value;
    const memo = document.getElementById("horseMemo").value;

    if(!frame || !no || !name || !jockey || !weight || !rank || !value || !track || !odds){
        alert("必須項目を入力してください");
        return;
    }

    horses.push({
        frame,
        no,
        name,
        jockey,
        weight,
        rank,
        value,
        track,
        odds,
        finish,
        memo
    });
    
    saveData();
    renderList();

    document.getElementById("horseFrame").value="";
    document.getElementById("horseNo").value="";
    document.getElementById("horseName").value="";
    document.getElementById("horseJockey").value="";
    document.getElementById("horseWeight").value="";
    document.getElementById("horseRank").value="";
    document.getElementById("horseValue").value="";
    document.getElementById("horseTrack").value="";
    document.getElementById("horseOdds").value="";
    document.getElementById("horseFinish").value="";
    document.getElementById("horseMemo").value="";
}

function editHorse(index){
    const horse = horses[index];

    const frame = prompt("枠番", horse.frame);
    if(frame===null) return;
    const no = prompt("馬番", horse.no);
    if(no===null) return;
    const name = prompt("馬名", horse.name);
    if(name===null) return;
    const jockey = prompt("騎手", horse.jockey);
    if(jockey===null) return;
    const weight = prompt("斤量", horse.weight);
    if(weight===null) return;
    const rank = prompt("評価", horse.rank);
    if(rank===null) return;
    const value = prompt("期待値ランク", horse.value);
    if(value===null) return;
    const odds = prompt("単勝オッズ", horse.odds);
    if(odds===null) return;
    const finish = prompt("着順", horse.finish || "");
    if(finish===null) return;
    const memo = prompt("メモ", horse.memo || "");
    if(memo===null) return;
    const track = prompt("馬場適性", horse.track || "△");
    if(track===null) return;   

    horses[index] = {
        frame,
        no,
        name,
        jockey,
        weight,
        rank,
        value,
        track,
        odds,
        finish,
        memo
    };

    saveData();
    renderList();
}

function deleteHorse(index){
    if(confirm("削除しますか？")){
        horses.splice(index, 1);
        saveData();
        renderList();
    }
}

function exportJSON(){
    const raceName = document.getElementById("raceName").value;
    const trackCondition = document.getElementById("trackCondition").value;
    const trackBias = document.getElementById("trackBias").value;

    const data = {
        raceName,
        trackCondition,
        trackBias,
        horses
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (raceName || "race") + ".json";
    a.click();
    URL.revokeObjectURL(url);
}

function importJSON(){
    const file = document.getElementById("jsonFile").files[0];
    if(!file){
        alert("JSONファイルを選択してください");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(event){
        const data = JSON.parse(event.target.result);
        document.getElementById("raceName").value = data.raceName || "";
        document.getElementById("trackCondition").value = data.trackCondition || "良";
        document.getElementById("trackBias").value = data.trackBias || "フラット";
        
        localStorage.setItem("raceName", document.getElementById("raceName").value);
        localStorage.setItem("trackCondition", document.getElementById("trackCondition").value);
        localStorage.setItem("trackBias", document.getElementById("trackBias").value);

        horses = data.horses || [];

        saveData();
        renderList();
        alert("読込完了");
    };
    reader.readAsText(file);
}

function saveRaceResult(){
    const top5 = horses.filter(h=>{
        const finish = Number(h.finish);
        return (finish >= 1 && finish <= 5);
    }).sort((a,b)=> Number(a.finish) - Number(b.finish));

const ranking = [];

horses.forEach(horse=>{

const totalPoint =

getRankPoint(horse.rank)
+
getValuePoint(horse.value || "D")
+
getTrackPoint(horse.track || "△");

ranking.push({

name: horse.name,

point: totalPoint,

odds: Number(
horse.odds || 999
)

});

});

ranking.sort((a,b)=>{

if(b.point !== a.point){

return b.point - a.point;

}

return a.odds - b.odds;

});    

raceHistory.push({

    date: new Date().toLocaleDateString(),

    raceName: document.getElementById(
        "raceName"
    ).value,

    trackCondition: document.getElementById(
        "trackCondition"
    ).value,

    trackBias: document.getElementById(
        "trackBias"
    ).value,

    favorite:
    ranking.length > 0
    ? ranking[0].name
    : "",

    favoriteFinish:
    top5.find(
        h => h.name === (
            ranking.length > 0
            ? ranking[0].name
            : ""
        )
    )?.finish || "着外",

    top5

});

saveRaceHistory();

renderHistory();

renderDashboard();

alert(
"結果保存完了"
);

function editHistory(index){
    const race = raceHistory[index];

    const newRaceName = prompt("レース名", race.raceName);
    if(newRaceName === null) return;
    const newTrackCondition = prompt("馬場状態（良/稍重/重/不良）", race.trackCondition);
    if(newTrackCondition === null) return;
    const newTrackBias = prompt("馬場傾向", race.trackBias);
    if(newTrackBias === null) return;

    const updatedTop5 = [];
    if(race.top5 && race.top5.length > 0){
        for(let i = 0; i < race.top5.length; i++){
            let h = race.top5[i];
            let editThis = confirm(`${i+1}番目の馬「${h.name}（${h.finish}着）」を編集しますか？`);
            if(editThis){
                let newFinish = prompt("着順", h.finish);
                if(newFinish === null) newFinish = h.finish;
                let newName = prompt("馬名", h.name);
                if(newName === null) newName = h.name;
                updatedTop5.push({ finish: newFinish, name: newName });
            } else {
                updatedTop5.push(h);
            }
        }
    }

    raceHistory[index].raceName = newRaceName;
    raceHistory[index].trackCondition = newTrackCondition;
    raceHistory[index].trackBias = newTrackBias;
    raceHistory[index].top5 = updatedTop5;

    saveRaceHistory();
    renderHistory();
    alert("保存済みレースを更新しました");
}

function deleteHistory(index){
    if(confirm("この保存済みレースを削除しますか？")){
        raceHistory.splice(index, 1);
        saveRaceHistory();
        renderHistory();
    }
}
    
function getRankPoint(rank){
    switch(rank){
        case "◎": return 5;
        case "○": return 4;
        case "▲": return 3;
        case "△": return 2;
        default: return 1;
    }
}

function getValuePoint(value){
    switch(value){
        case "S": return 5;
        case "A": return 4;
        case "B": return 3;
        case "C": return 2;
        default: return 1;
    }
}

// 馬場状態・馬場傾向を加味した馬場適性ポイント計算ロジック
function getTrackPoint(track){
    const condition = document.getElementById("trackCondition").value;
    const bias = document.getElementById("trackBias").value;

    let basePoint = 0;
    switch(track){
        case "◎": basePoint = 2; break;
        case "○": basePoint = 1; break;
        case "△": basePoint = 0; break;
        default: basePoint = -1; break;
    }

    // 馬場状態による補正
    if(condition === "重" || condition === "不良"){
        if(track === "◎") basePoint += 2;
        else if(track === "○") basePoint += 1;
        else if(track === "×") basePoint -= 1;
    } else if(condition === "稍重"){
        if(track === "◎") basePoint += 1;
    }

    // 馬場傾向（フラット以外）による適性重視補正
    if(bias !== "フラット"){
        if(track === "◎" || track === "○"){
            basePoint += 1;
        }
    }

    return basePoint;
}

function getRankFromOdds(odds){
    odds = Number(odds);
    if(odds <= 3) return "◎";
    if(odds <= 7) return "○";
    if(odds <= 15) return "▲";
    if(odds <= 30) return "△";
    return "×";
}   

function getValueFromOdds(odds){
    odds = Number(odds);
    if(odds <= 5) return "D";
    if(odds <= 10) return "C";
    if(odds <= 20) return "B";
    if(odds <= 40) return "A";
    return "S";
}

function renderList(){
    let html = "";

    horses.forEach((horse,index)=>{
        const totalPoint = getRankPoint(horse.rank) + getValuePoint(horse.value || "D") + getTrackPoint(horse.track || "△");

        html += `
        <div class="horse">
        <b>${horse.frame}枠 ${horse.no}番 ${horse.name}</b>
        <br><br>
        <div class="rank">評価：${horse.rank}</div>
        <div class="value">期待値：${horse.value}<br>
        馬場適性：${horse.track || "△"}<br>
        総合点：${totalPoint}</div>
        <br>
        騎手：${horse.jockey}<br>
        斤量：${horse.weight}kg<br><br>
        単勝オッズ：${horse.odds || "-"}<br>
        着順：${horse.finish || "-"}<br>
        <div class="memo">
        <b>メモ</b><br>${horse.memo || "なし"}
        </div>
        <br>
        <button class="edit-btn" onclick="editHorse(${index})">✏️編集</button>
        <button class="delete-btn" onclick="deleteHorse(${index})">🗑削除</button>
        </div>
        `;
    });

    document.getElementById("horseList").innerHTML = html;
    updateSummary();
}

function updateSummary(){
    let mainHorse = "まだ登録されていません";
    const marks = [];
    const ranking = [];

    horses.forEach(horse=>{
        const totalPoint = getRankPoint(horse.rank) + getValuePoint(horse.value || "D") + getTrackPoint(horse.track || "△");
        ranking.push({
            name: horse.name,
            point: totalPoint,
            odds: Number(horse.odds || 999)
        });
    });

    ranking.sort((a,b)=>{
        if(b.point !== a.point){
            return b.point - a.point;
        }
        return a.odds - b.odds;
    });

    if(ranking.length > 0){
        mainHorse = `${ranking[0].name}（総合点:${ranking[0].point}）`;
    }

    const markSymbol = ["◎","○","▲","△"];
    marks.length = 0;

    ranking.forEach((horse,index)=>{
        if(index < 4){
            marks.push(`${markSymbol[index]} ${horse.name}`);
        }
    });   

    let rankingHtml = "";
    ranking.forEach((horse,index)=>{
        rankingHtml += `${index + 1}位 ${horse.name}（${horse.point}点）<br>`;
    });
   
    document.getElementById("mainHorse").innerHTML = mainHorse;
    document.getElementById("markList").innerHTML = marks.length ? marks.join("<br>") : "まだ登録されていません";
    document.getElementById("rankingList").innerHTML = ranking.length ? rankingHtml : "まだ登録されていません";   
}

function renderHistory(){
    let html = "";

    raceHistory.forEach((race, index)=>{
        html += `<div class="history-item">`;
        html += `<b>📅 ${race.date || ""} ｜ ${race.raceName}</b><br>`;
        html += `馬場：${race.trackCondition} ／ ${race.trackBias}<br><br>`;

        if(race.top5 && race.top5.length > 0){
            race.top5.forEach(horse=>{
                html += `${horse.finish}着：${horse.name}<br>`;
            });
        } else {
            html += `上位馬データなし<br>`;
        }

        html += `<br>`;
        html += `<button class="edit-btn" onclick="editHistory(${index})">✏️編集</button> `;
        html += `<button class="delete-btn" onclick="deleteHistory(${index})">🗑削除</button>`;
        html += `</div>`;
    });

    document.getElementById("historyList").innerHTML = html || "まだ保存されていません";
}

function renderDashboard(){

let totalRaces =
raceHistory.length;

let first = 0;
let second = 0;
let third = 0;

raceHistory.forEach(race=>{

race.top5.forEach(horse=>{

const finish =
Number(horse.finish);

if(finish === 1) first++;

if(finish === 2) second++;

if(finish === 3) third++;

});

});

const placeRate =

totalRaces > 0

?

(
(
(first + second + third)
/
totalRaces
)
*
100
).toFixed(1)

: 0;

document.getElementById(
"dashboard"
).innerHTML =

`

総保存レース数：
${totalRaces}レース

<br><br>

1着記録：
${first}

<br>

2着記録：
${second}

<br>

3着記録：
${third}

<br><br>

3着内率：
${placeRate}%

`;

}    
</script>

</body>
</html>
